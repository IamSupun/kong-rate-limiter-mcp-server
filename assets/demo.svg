<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<defs><style>
.s { font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
.m { font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
@keyframes k0 { 0%,3.8% { opacity:0; transform:translateY(8px) } 6.8%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r0 { animation:k0 16.0s ease-out infinite; }
@keyframes k1 { 0%,14.4% { opacity:0; transform:translateY(8px) } 17.4%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r1 { animation:k1 16.0s ease-out infinite; }
@keyframes k2 { 0%,25.0% { opacity:0; transform:translateY(8px) } 28.0%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r2 { animation:k2 16.0s ease-out infinite; }
@keyframes k3 { 0%,35.6% { opacity:0; transform:translateY(8px) } 38.6%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r3 { animation:k3 16.0s ease-out infinite; }
@keyframes k4 { 0%,46.2% { opacity:0; transform:translateY(8px) } 49.2%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r4 { animation:k4 16.0s ease-out infinite; }
@keyframes k5 { 0%,56.9% { opacity:0; transform:translateY(8px) } 59.9%,92% { opacity:1; transform:none } 97%,100% { opacity:0 } } .r5 { animation:k5 16.0s ease-out infinite; }
</style></defs>
<rect x="1" y="1" width="898" height="468" rx="16" fill="#0b0820" stroke="#7c3aed" stroke-width="2"/>
<rect x="1" y="1" width="898" height="44" rx="16" fill="#140c30"/><rect x="1" y="30" width="898" height="15" fill="#140c30"/>
<circle cx="28" cy="23" r="6" fill="#f472b6"/><circle cx="48" cy="23" r="6" fill="#facc15"/><circle cx="68" cy="23" r="6" fill="#4ade80"/>
<text x="450.0" y="28" text-anchor="middle" class="m" font-size="13" fill="#94a3b8">AI agent  ⇄  kong-rate-limiter MCP  ⇄  Kong Admin API</text>
<g transform="translate(0,78)"><g class="r0"><rect x="300" y="0" width="560" height="50" rx="14" fill="#1e3a5f"/><text x="320" y="31" class="s" font-size="15" fill="#e0f2fe">Add a payments service at api.example.com with a /payments route</text></g></g>
<g transform="translate(0,144)"><g class="r1"><rect x="40" y="0" width="820" height="44" rx="10" fill="#140c30" stroke="#7c3aed" stroke-opacity=".7"/><text x="58" y="27" class="m" font-size="13" fill="#c4b5fd">🔧 kong_create_service(name=&quot;payments&quot;, url=&quot;https://api.example.com/payments&quot;)</text><text x="842" y="27" text-anchor="end" class="m" font-size="13" font-weight="700" fill="#4ade80">✓ created</text></g></g>
<g transform="translate(0,204)"><g class="r2"><rect x="40" y="0" width="820" height="44" rx="10" fill="#140c30" stroke="#7c3aed" stroke-opacity=".7"/><text x="58" y="27" class="m" font-size="13" fill="#c4b5fd">🔧 kong_create_route(service=&quot;payments&quot;, paths=[&quot;/payments&quot;])</text><text x="842" y="27" text-anchor="end" class="m" font-size="13" font-weight="700" fill="#4ade80">✓ created</text></g></g>
<g transform="translate(0,264)"><g class="r3"><rect x="300" y="0" width="560" height="50" rx="14" fill="#1e3a5f"/><text x="320" y="31" class="s" font-size="15" fill="#e0f2fe">Now limit it to 100 requests per minute</text></g></g>
<g transform="translate(0,330)"><g class="r4"><rect x="40" y="0" width="820" height="44" rx="10" fill="#140c30" stroke="#7c3aed" stroke-opacity=".7"/><text x="58" y="27" class="m" font-size="13" fill="#c4b5fd">🔧 kong_create_rate_limiting_plugin(service=&quot;payments&quot;, minute=100, policy=&quot;local&quot;)</text><text x="842" y="27" text-anchor="end" class="m" font-size="13" font-weight="700" fill="#4ade80">✓ enabled</text></g></g>
<g transform="translate(0,390)"><g class="r5"><rect x="40" y="0" width="680" height="50" rx="14" fill="#2a1052"/><text x="60" y="31" class="s" font-size="15" fill="#f5d0fe">🤖 Done. /payments is live and capped at 100 req/min. Extra calls get HTTP 429.</text></g></g>
</svg>