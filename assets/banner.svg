<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0820"/><stop offset=".6" stop-color="#140b2e"/><stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#c084fc"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="f"><rect width="1200" height="360" rx="18"/></clipPath>
    <style>
      .s { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .m { font-family: 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
      .flow { stroke-dasharray: 8 10; animation: fl 1.1s linear infinite; }
      @keyframes fl { to { stroke-dashoffset: -36 } }
      .pkt { animation: pk 2.4s linear infinite; }
      @keyframes pk { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 90% { opacity: 1 } 100% { transform: translateX(300px); opacity: 0 } }
      .p2 { animation-delay: .8s } .p3 { animation-delay: 1.6s }
      .meter { transform-box: fill-box; transform-origin: left; animation: me 3s ease-in-out infinite; }
      @keyframes me { 0% { transform: scaleX(.2) } 60% { transform: scaleX(1) } 70%,100% { transform: scaleX(.68) } }
      .warn { animation: wa 3s steps(1) infinite; }
      @keyframes wa { 0%,55% { opacity: 0 } 56%,100% { opacity: 1 } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pu 2s ease-in-out infinite; }
      @keyframes pu { 50% { transform: scale(1.08) } }
      .cur { animation: cu 1s steps(1) infinite; } @keyframes cu { 50% { opacity: 0 } }
    </style>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <g stroke="#7c3aed" stroke-opacity=".12">
      <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200M100 0V360M200 0V360M300 0V360M400 0V360M500 0V360M600 0V360M700 0V360M800 0V360M900 0V360M1000 0V360M1100 0V360"/>
    </g>

    <text x="600" y="70" text-anchor="middle" class="s" font-size="46" font-weight="800" fill="url(#t)" filter="url(#glow)">Kong Rate Limiter MCP</text>
    <text x="600" y="104" text-anchor="middle" class="m" font-size="17" fill="#cbd5e1">Manage Kong API Gateway in plain English, from any AI agent</text>

    <!-- chat bubble -->
    <g transform="translate(60,150)">
      <rect width="300" height="120" rx="16" fill="#120b2e" stroke="#22d3ee" stroke-opacity=".8"/>
      <text x="20" y="32" class="m" font-size="13" fill="#22d3ee">YOU → AI AGENT</text>
      <text x="20" y="62" class="s" font-size="17" fill="#f1f5f9">"Limit /payments to</text>
      <text x="20" y="86" class="s" font-size="17" fill="#f1f5f9">100 requests per minute"<tspan class="cur" fill="#22d3ee">▌</tspan></text>
    </g>

    <!-- flow 1 -->
    <path class="flow" d="M370 210H450" stroke="#22d3ee" stroke-width="3" fill="none"/>

    <!-- MCP server -->
    <g transform="translate(460,160)" class="pulse">
      <rect width="280" height="100" rx="16" fill="#1a0f3d" stroke="#c084fc" stroke-width="2" filter="url(#glow)"/>
      <text x="140" y="40" text-anchor="middle" class="s" font-size="22" font-weight="800" fill="#e9d5ff">MCP SERVER</text>
      <text x="140" y="66" text-anchor="middle" class="m" font-size="13" fill="#c4b5fd">17 tools · FastMCP · SSE</text>
      <text x="140" y="86" text-anchor="middle" class="m" font-size="12" fill="#94a3b8">kong_create_rate_limiting_plugin()</text>
    </g>

    <!-- flow 2 -->
    <path class="flow" d="M750 210H830" stroke="#f472b6" stroke-width="3" fill="none"/>

    <!-- Kong gateway + meter -->
    <g transform="translate(840,150)">
      <rect width="300" height="120" rx="16" fill="#120b2e" stroke="#f472b6" stroke-opacity=".8"/>
      <text x="20" y="32" class="m" font-size="13" fill="#f472b6">KONG GATEWAY · /payments</text>
      <rect x="20" y="52" width="260" height="16" rx="8" fill="#2a1d5c"/>
      <rect class="meter" x="20" y="52" width="260" height="16" rx="8" fill="url(#t)"/>
      <text x="20" y="96" class="s" font-size="15" fill="#e2e8f0">100 req/min · local</text>
      <text class="warn s" x="280" y="96" text-anchor="end" font-size="15" font-weight="700" fill="#4ade80">✓ enforced</text>
    </g>

    <!-- packets -->
    <g transform="translate(60,320)">
      <rect x="0" y="0" width="1080" height="2" fill="#7c3aed" opacity=".35"/>
      <circle class="pkt" cx="0" cy="1" r="5" fill="#22d3ee"/>
      <circle class="pkt p2" cx="380" cy="1" r="5" fill="#c084fc"/>
      <circle class="pkt p3" cx="760" cy="1" r="5" fill="#f472b6"/>
    </g>
    <text x="600" y="306" text-anchor="middle" class="m" font-size="13" fill="#64748b">🥇 1st place · Kong × KTH AI-Assisted Enterprise Coding Hackathon</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="18" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity=".8"/>
</svg>
